repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        types: [python]

      - id: clear-notebook-output
        name: Clear notebook outputs
        entry: python3 -m jupyter nbconvert --clear-output --inplace
        language: system
        files: \.ipynb$
